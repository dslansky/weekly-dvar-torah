<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Quick Torah Thoughts — Dvar Torah Archive</title>
  <meta name="description" content="An archive of weekly Divrei Torah on the parsha, by Dov Slansky." />
  <link rel="icon" href="data:," />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Frank+Ruhl+Libre:wght@400;500;700&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Serif:ital,wght@0,400;0,600;1,400&display=swap"
    rel="stylesheet"
  />
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <header class="site-header">
    <h1 class="site-title">Quick Torah Thoughts</h1>
    <p class="site-subtitle">Short divrei Torah on the weekly parsha, recorded most Fridays.</p>

    <div class="header-row">
      <a class="stamp-btn" href="https://podcasts.apple.com/us/podcast/quick-torah-thoughts/id6794228563" target="_blank" rel="noopener">Listen on Apple Podcasts</a>
      <div class="listen-links">
        <a href="/feed.xml">RSS feed</a>
      </div>
    </div>

    <div class="search-row" id="search-row">
      <label class="visually-hidden" for="search-input">Search by parsha name</label>
      <input
        type="search"
        id="search-input"
        class="search-input"
        placeholder="search"
        autocomplete="off"
      />
    </div>

    <div class="tags-row" id="tags-row" hidden></div>
  </header>

  <main id="archive-root" class="archive-root" aria-live="polite">
    <p class="loading-line">Loading archive…</p>
  </main>

  <footer class="site-footer">
    <p class="dedication" lang="he" dir="rtl">
      לזכר נשמת גבריאל שמחה בן ר' שמואל אליהו
    </p>
    <p class="footer-meta">
      Quick Torah Thoughts — Dov Slansky ·
      <a href="/feed.xml">RSS feed</a>
    </p>
  </footer>

  <script src="/app.js" defer></script>
</body>
</html>
