<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Quick Torah Thoughts — Dvar Torah Archive</title>
  <meta name="description" content="An archive of weekly Divrei Torah on the parsha, by Dov Slansky." />
  <link rel="icon" href="data:," />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Frank+Ruhl+Libre:wght@400;500;700&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Serif:ital,wght@0,400;0,600;1,400&display=swap"
    rel="stylesheet"
  />
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <div class="stamp-corner" aria-hidden="true">DT&nbsp;ARCHIVE</div>

  <header class="site-header">
    <h1 class="site-title">Quick Torah Thoughts</h1>
    <p class="site-subtitle">a tape library of weekly divrei torah — parshas hashavua</p>

    <div class="header-row">
      <a class="subscribe-link" href="/feed.xml" id="subscribe-link">
        <span class="subscribe-dot" aria-hidden="true"></span>
        Subscribe as a podcast
      </a>
    </div>

    <div class="search-row">
      <label class="visually-hidden" for="search-input">Search by parsha name</label>
      <input
        type="search"
        id="search-input"
        class="search-input"
        placeholder="Search by parsha…  לך לך, Vayeira…"
        autocomplete="off"
      />
    </div>
  </header>

  <main id="archive-root" class="archive-root" aria-live="polite">
    <p class="loading-line">Loading archive…</p>
  </main>

  <footer class="site-footer">
    <p class="dedication" lang="he" dir="rtl">
      לזכר נשמת גבריאל שמחה בן ר' שמואל אליהו
    </p>
    <p class="footer-meta">
      Quick Torah Thoughts — Dov Slansky ·
      <a href="/feed.xml">RSS feed</a>
    </p>
  </footer>

  <script src="/app.js" defer></script>
</body>
</html>
